<!DOCTYPE html>
<html lang="en" class="h-full bg-black select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Photos</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for iOS Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* San Francisco Font Fallbacks */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        /* iOS Translucent Glass Blur Effect */
        .ios-blur {
            background-color: rgba(18, 18, 18, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .ios-blur-modal {
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
        }

        /* Custom Scrollbar for sleek look */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }

        /* Grid transition & touch response */
        .photo-thumb {
            transition: opacity 0.15s ease, transform 0.15s ease;
        }
        .photo-thumb:active {
            opacity: 0.7;
            transform: scale(0.98);
        }

        /* Lightbox Image Animations */
        .lightbox-img {
            transition: transform 0.25s cubic-bezier(0.2, 0, 0.2, 1);
            max-height: 85vh;
            max-width: 100vw;
            object-fit: contain;
        }

        /* Hide interface controls in fullscreen modal on double tap/idle */
        .fade-ui {
            transition: opacity 0.25s ease-in-out;
        }
    </style>
</head>
<body class="h-full flex flex-col justify-between text-white">

    <!-- iOS Photos Sticky Header -->
    <header class="sticky top-0 z-30 ios-blur border-b border-white/10 px-4 pt-10 pb-3 flex justify-between items-end transition-all duration-300">
        <div>
            <p class="text-xs uppercase tracking-wider text-gray-400 font-semibold mb-0.5">Library</p>
            <h1 class="text-2xl font-bold tracking-tight">All Photos</h1>
        </div>
        <div class="flex items-center space-x-3 text-blue-500 font-medium text-sm">
            <button id="grid-toggle-btn" class="p-1.5 rounded-full bg-white/10 text-white hover:bg-white/20 transition">
                <i class="fa-solid fa-grid-2 text-xs"></i> <span>3 Columns</span>
            </button>
            <button class="p-1.5 rounded-full bg-white/10 text-white hover:bg-white/20 transition">
                <i class="fa-solid fa-ellipsis"></i>
            </button>
        </div>
    </header>

    <!-- Main Photo Grid Container -->
    <main class="flex-1 w-full max-w-5xl mx-auto px-0.5 pt-1 pb-16">
        <!-- Photo Count Header Subtitle -->
        <div class="text-center py-2 text-xs text-gray-500 font-medium tracking-wide">
            <span id="total-photos-count">18</span> Photos
        </div>

        <!-- The Photo Grid (Default 3 Columns on Mobile, 4 on Desktop) -->
        <div id="photo-grid" class="grid grid-cols-3 md:grid-cols-4 gap-0.5">
            <!-- Grid thumbnails dynamically generated by JavaScript -->
        </div>
    </main>

    <!-- iOS Style Fullscreen Lightbox Modal -->
    <div id="lightbox" class="fixed inset-0 z-50 hidden flex flex-col justify-between bg-black/95 transition-opacity duration-300 opacity-0 touch-none">
        
        <!-- Lightbox Top Navigation Bar -->
        <div id="lightbox-header" class="ios-blur-modal border-b border-white/10 px-4 pt-10 pb-3 flex justify-between items-center fade-ui z-10">
            <button id="close-btn" class="flex items-center space-x-1 text-blue-500 text-base font-normal active:opacity-60">
                <i class="fa-solid fa-chevron-left text-lg"></i>
                <span>Back</span>
            </button>
            
            <div id="photo-index-indicator" class="text-xs font-semibold text-gray-300 tracking-wide">
                1 of 18
            </div>

            <div class="flex items-center space-x-4 text-blue-500 text-lg">
                <button id="share-btn" class="active:opacity-60"><i class="fa-solid fa-arrow-up-from-bracket"></i></button>
                <button id="favorite-btn" class="active:opacity-60"><i class="fa-regular fa-heart"></i></button>
            </div>
        </div>

        <!-- Lightbox Central Image Display Area -->
        <div id="lightbox-content" class="relative flex-1 flex items-center justify-center overflow-hidden w-full h-full">
            <!-- Left Navigation Arrow (Desktop hover/Mobile tap) -->
            <button id="prev-btn" class="absolute left-3 z-20 p-3 rounded-full bg-black/40 text-white/80 hover:text-white hover:bg-black/70 backdrop-blur-md transition hidden md:flex items-center justify-center">
                <i class="fa-solid fa-chevron-left text-xl"></i>
            </button>

            <!-- Lightbox Main Image -->
            <img id="lightbox-img" class="lightbox-img select-none cursor-grab active:cursor-grabbing" src="" alt="Full view" />

            <!-- Right Navigation Arrow -->
            <button id="next-btn" class="absolute right-3 z-20 p-3 rounded-full bg-black/40 text-white/80 hover:text-white hover:bg-black/70 backdrop-blur-md transition hidden md:flex items-center justify-center">
                <i class="fa-solid fa-chevron-right text-xl"></i>
            </button>
        </div>

        <!-- Lightbox Bottom Actions Bar -->
        <div id="lightbox-footer" class="ios-blur-modal border-t border-white/10 px-6 py-4 flex justify-between items-center text-blue-500 text-xl fade-ui z-10">
            <button class="active:opacity-60"><i class="fa-solid fa-arrow-up-from-bracket"></i></button>
            <button id="info-btn" class="active:opacity-60 text-gray-300"><i class="fa-solid fa-circle-info"></i></button>
            <button id="delete-btn" class="active:opacity-60 text-red-500"><i class="fa-regular fa-trash-can"></i></button>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // High Quality Curated Imagery Dataset (Unsplash)
        const photos = [
            { id: 1, url: 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1200&q=80', title: 'Yosemite Valley' },
            { id: 2, url: 'https://images.unsplash.com/photo-1511884642898-4c92249e20b6?auto=format&fit=crop&w=1200&q=80', title: 'Mountain Lake' },
            { id: 3, url: 'https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=1200&q=80', title: 'Foggy Forest' },
            { id: 4, url: 'https://images.unsplash.com/photo-1472214103451-9374bd1c798e?auto=format&fit=crop&w=1200&q=80', title: 'Green Meadows' },
            { id: 5, url: 'https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1200&q=80', title: 'Coastal Cliffs' },
            { id: 6, url: 'https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=1200&q=80', title: 'Highland Sunset' },
            { id: 7, url: 'https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?auto=format&fit=crop&w=1200&q=80', title: 'Deep Woods' },
            { id: 8, url: 'https://images.unsplash.com/photo-1433086966358-54859d0ed716?auto=format&fit=crop&w=1200&q=80', title: 'Waterfall Mist' },
            { id: 9, url: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&q=80', title: 'Tropical Beach' },
            { id: 10, url: 'https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1200&q=80', title: 'Starry Peaks' },
            { id: 11, url: 'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1200&q=80', title: 'Alpine Ridge' },
            { id: 12, url: 'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=80', title: 'Autumn Trail' },
            { id: 13, url: 'https://images.unsplash.com/photo-1426604966848-d7adac402bff?auto=format&fit=crop&w=1200&q=80', title: 'Canyon Valley' },
            { id: 14, url: 'https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=1200&q=80', title: 'Ocean Waves' },
            { id: 15, url: 'https://images.unsplash.com/photo-1499856871958-5b9627545d1a?auto=format&fit=crop&w=1200&q=80', title: 'Paris Streets' },
            { id: 16, url: 'https://images.unsplash.com/photo-1513836279014-a89f7a76ae86?auto=format&fit=crop&w=1200&q=80', title: 'Redwood Trees' },
            { id: 17, url: 'https://images.unsplash.com/photo-1502082553048-f009c37129b9?auto=format&fit=crop&w=1200&q=80', title: 'Golden Hour Field' },
            { id: 18, url: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=1200&q=80', title: 'Northern Lights' }
        ];

        // State variables
        let currentIndex = 0;
        let isZoomed = false;
        let is3Columns = true;
        let touchStartX = 0;
        let touchEndX = 0;
        let touchStartY = 0;
        let touchEndY = 0;

        // DOM Elements
        const photoGrid = document.getElementById('photo-grid');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const closeBtn = document.getElementById('close-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const photoIndexIndicator = document.getElementById('photo-index-indicator');
        const totalPhotosCount = document.getElementById('total-photos-count');
        const gridToggleBtn = document.getElementById('grid-toggle-btn');
        const favoriteBtn = document.getElementById('favorite-btn');
        const lightboxHeader = document.getElementById('lightbox-header');
        const lightboxFooter = document.getElementById('lightbox-footer');

        // Initialize App
        function initGallery() {
            totalPhotosCount.textContent = photos.length;
            renderGrid();
            setupEventListeners();
        }

        // Render Photo Grid
        function renderGrid() {
            photoGrid.innerHTML = '';
            photos.forEach((photo, index) => {
                const thumbWrapper = document.createElement('div');
                thumbWrapper.className = 'photo-thumb relative aspect-square overflow-hidden bg-gray-900 cursor-pointer';
                
                const img = document.createElement('img');
                img.src = photo.url;
                img.alt = photo.title;
                img.className = 'w-full h-full object-cover';
                img.loading = 'lazy';

                thumbWrapper.appendChild(img);
                thumbWrapper.addEventListener('click', () => openLightbox(index));
                photoGrid.appendChild(thumbWrapper);
            });
        }

        // Open Lightbox Modal
        function openLightbox(index) {
            currentIndex = index;
            updateLightboxContent();
            
            lightbox.classList.remove('hidden');
            // Trigger reflow for smooth opacity transition
            setTimeout(() => {
                lightbox.classList.remove('opacity-0');
                lightbox.classList.add('opacity-100');
            }, 10);
            
            document.body.style.overflow = 'hidden'; // Prevent main scrolling
        }

        // Close Lightbox Modal
        function closeLightbox() {
            lightbox.classList.remove('opacity-100');
            lightbox.classList.add('opacity-0');
            resetZoom();

            setTimeout(() => {
                lightbox.classList.add('hidden');
                document.body.style.overflow = 'auto';
            }, 300);
        }

        // Update Lightbox Image & Indicators
        function updateLightboxContent() {
            const currentPhoto = photos[currentIndex];
            lightboxImg.src = currentPhoto.url;
            photoIndexIndicator.textContent = `${currentIndex + 1} of ${photos.length}`;
            resetZoom();
        }

        // Navigate Next / Previous
        function navigatePhoto(direction) {
            if (direction === 'next') {
                currentIndex = (currentIndex + 1) % photos.length;
            } else if (direction === 'prev') {
                currentIndex = (currentIndex - 1 + photos.length) % photos.length;
            }
            updateLightboxContent();
        }

        // Toggle Double-Tap Zoom Simulation
        function toggleZoom() {
            if (!isZoomed) {
                lightboxImg.style.transform = 'scale(2.2)';
                isZoomed = true;
            } else {
                resetZoom();
            }
        }

        function resetZoom() {
            lightboxImg.style.transform = 'scale(1)';
            isZoomed = false;
        }

        // Toggle UI controls display on click inside lightbox
        function toggleUIOverlay(e) {
            // Prevent toggling if clicked on action buttons
            if (e.target.closest('button')) return;

            lightboxHeader.classList.toggle('opacity-0');
            lightboxFooter.classList.toggle('opacity-0');
        }

        // Setup All Interactions & Event Listeners
        function setupEventListeners() {
            // Close Lightbox
            closeBtn.addEventListener('click', closeLightbox);

            // Desktop Prev/Next Buttons
            prevBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                navigatePhoto('prev');
            });

            nextBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                navigatePhoto('next');
            });

            // Column Toggle (3 vs 4 columns layout)
            gridToggleBtn.addEventListener('click', () => {
                is3Columns = !is3Columns;
                if (is3Columns) {
                    photoGrid.className = 'grid grid-cols-3 md:grid-cols-4 gap-0.5';
                    gridToggleBtn.querySelector('span').textContent = '3 Columns';
                } else {
                    photoGrid.className = 'grid grid-cols-5 md:grid-cols-6 gap-0.5';
                    gridToggleBtn.querySelector('span').textContent = '5 Columns';
                }
            });

            // Keyboard Arrow Key Navigation
            window.addEventListener('keydown', (e) => {
                if (lightbox.classList.contains('hidden')) return;

                if (e.key === 'Escape') closeLightbox();
                if (e.key === 'ArrowRight') navigatePhoto('next');
                if (e.key === 'ArrowLeft') navigatePhoto('prev');
            });

            // Favorite Button Toggle
            favoriteBtn.addEventListener('click', () => {
                const icon = favoriteBtn.querySelector('i');
                if (icon.classList.contains('fa-regular')) {
                    icon.classList.remove('fa-regular');
                    icon.classList.add('fa-solid', 'text-red-500');
                } else {
                    icon.classList.remove('fa-solid', 'text-red-500');
                    icon.classList.add('fa-regular');
                }
            });

            // Double Tap / Double Click to Zoom
            let lastClick = 0;
            lightboxImg.addEventListener('click', (e) => {
                const now = new Date().getTime();
                const timespan = now - lastClick;
                if (timespan < 300 && timespan > 0) {
                    toggleZoom();
                } else {
                    toggleUIOverlay(e);
                }
                lastClick = now;
            });

            // Swipe & Gesture Interactions
            lightbox.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
                touchStartY = e.changedTouches[0].screenY;
            }, { passive: true });

            lightbox.addEventListener('touchend', (e) => {
                touchEndX = e.changedTouches[0].screenX;
                touchEndY = e.changedTouches[0].screenY;
                handleSwipeGesture();
            }, { passive: true });
        }

        // Swipe Logic (Swipe Down to Close, Swipe Left/Right to Navigate)
        function handleSwipeGesture() {
            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;

            // Horizontal Swipe for Navigation
            if (Math.abs(diffX) > 50 && Math.abs(diffY) < 60) {
                if (diffX < 0) {
                    navigatePhoto('next'); // Swipe Left -> Next
                } else {
                    navigatePhoto('prev'); // Swipe Right -> Prev
                }
            }

            // Vertical Swipe Down to Close Modal
            if (diffY > 100 && Math.abs(diffX) < 80) {
                closeLightbox();
            }
        }

        // Initialize Grid on Load
        window.onload = initGallery;
    </script>
</body>
</html>
